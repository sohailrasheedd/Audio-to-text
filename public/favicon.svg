<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="url(#bg-gradient)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255,255,255,0.12)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0" y1="10" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Soundwave / Speech bars -->
  <rect x="12" y="24" width="5" height="16" rx="2.5" fill="url(#wave-gradient)"/>
  <rect x="21" y="16" width="5" height="32" rx="2.5" fill="url(#wave-gradient)"/>
  <rect x="30" y="10" width="5" height="44" rx="2.5" fill="url(#wave-gradient)"/>
  <rect x="39" y="18" width="5" height="28" rx="2.5" fill="url(#wave-gradient)"/>
  <rect x="48" y="26" width="5" height="12" rx="2.5" fill="url(#wave-gradient)"/>
</svg>
